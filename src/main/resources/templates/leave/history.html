<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Leave History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container">
    <h2>My Leave History</h2>
    <p th:if="${param.applied != null}" class="alert alert-success">Leave request submitted successfully.</p>
    <table class="table table-bordered bg-white">
        <thead class="table-light">
        <tr>
            <th>Leave Type</th>
            <th>Start</th>
            <th>End</th>
            <th>Days</th>
            <th>Reason</th>
            <th>Status</th>
            <th>Manager Comment</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${requests}">
            <td th:text="${r.leaveType.name}"></td>
            <td th:text="${r.startDate}"></td>
            <td th:text="${r.endDate}"></td>
            <td th:text="${r.numberOfDays}"></td>
            <td th:text="${r.reason}"></td>
            <td>
                <span class="badge"
                      th:classappend="${r.status.name() == 'APPROVED'} ? 'bg-success' : (${r.status.name() == 'REJECTED'} ? 'bg-danger' : (${r.status.name() == 'CANCELLED'} ? 'bg-secondary' : 'bg-warning text-dark'))"
                      th:text="${r.status}"></span>
            </td>
            <td th:text="${r.managerComment}"></td>
            <td>
                <form th:if="${r.status.name() == 'PENDING'}" th:action="@{/leave/{id}/cancel(id=${r.id})}" method="post">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Cancel</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(requests)}">
            <td colspan="8" class="text-muted">No leave requests yet.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>HR Leave Reports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container">
    <h2>Company-Wide Leave Balances</h2>
    <table class="table table-bordered bg-white">
        <thead class="table-light">
        <tr>
            <th>Employee</th>
            <th>Department</th>
            <th>Leave Type</th>
            <th>Total</th>
            <th>Used</th>
            <th>Remaining</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="b : ${balances}">
            <td th:text="${b.user.fullName}"></td>
            <td th:text="${b.user.department}"></td>
            <td th:text="${b.leaveType.name}"></td>
            <td th:text="${b.totalDays}"></td>
            <td th:text="${b.usedDays}"></td>
            <td th:text="${b.remainingDays}"></td>
        </tr>
        </tbody>
    </table>

    <h2 class="mt-5">All Leave Requests</h2>
    <table class="table table-bordered bg-white">
        <thead class="table-light">
        <tr>
            <th>Employee</th>
            <th>Department</th>
            <th>Leave Type</th>
            <th>Start</th>
            <th>End</th>
            <th>Days</th>
            <th>Status</th>
            <th>Decided By</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${requests}">
            <td th:text="${r.employee.fullName}"></td>
            <td th:text="${r.employee.department}"></td>
            <td th:text="${r.leaveType.name}"></td>
            <td th:text="${r.startDate}"></td>
            <td th:text="${r.endDate}"></td>
            <td th:text="${r.numberOfDays}"></td>
            <td th:text="${r.status}"></td>
            <td th:text="${r.decidedBy != null ? r.decidedBy.fullName : '-'}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(requests)}">
            <td colspan="8" class="text-muted">No leave requests yet.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>

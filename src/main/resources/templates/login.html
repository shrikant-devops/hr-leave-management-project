<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - HR Leave Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center" style="min-height:100vh;">
    <div class="card shadow-sm" style="width: 380px;">
        <div class="card-body">
            <h4 class="card-title mb-3 text-center">HR Leave Management</h4>
            <p th:if="${param.error}" class="alert alert-danger">Invalid email or password.</p>
            <p th:if="${param.logout}" class="alert alert-success">You have been logged out.</p>
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Sign In</button>
            </form>
            <hr>
            <p class="small text-muted mb-1">Demo accounts (password: <code>password123</code>):</p>
            <ul class="small text-muted mb-0">
                <li>hr@hrms.local &mdash; HR</li>
                <li>manager@hrms.local &mdash; Manager</li>
                <li>alice@hrms.local &mdash; Employee</li>
                <li>bob@hrms.local &mdash; Employee</li>
            </ul>
        </div>
    </div>
</div>
</body>
</html>

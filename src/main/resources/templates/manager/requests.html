<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Team Leave Requests</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container">
    <h2>Pending Requests</h2>
    <p th:if="${param.error}" class="alert alert-danger" th:text="${param.error}"></p>

    <table class="table table-bordered bg-white">
        <thead class="table-light">
        <tr>
            <th>Employee</th>
            <th>Leave Type</th>
            <th>Start</th>
            <th>End</th>
            <th>Days</th>
            <th>Reason</th>
            <th>Decision</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${pending}">
            <td th:text="${r.employee.fullName}"></td>
            <td th:text="${r.leaveType.name}"></td>
            <td th:text="${r.startDate}"></td>
            <td th:text="${r.endDate}"></td>
            <td th:text="${r.numberOfDays}"></td>
            <td th:text="${r.reason}"></td>
            <td>
                <form th:action="@{/manager/requests/{id}/approve(id=${r.id})}" method="post" class="d-inline">
                    <input type="hidden" name="comment" value="Approved">
                    <button type="submit" class="btn btn-sm btn-success">Approve</button>
                </form>
                <form th:action="@{/manager/requests/{id}/reject(id=${r.id})}" method="post" class="d-inline">
                    <input type="hidden" name="comment" value="Rejected">
                    <button type="submit" class="btn btn-sm btn-danger">Reject</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(pending)}">
            <td colspan="7" class="text-muted">No pending requests.</td>
        </tr>
        </tbody>
    </table>

    <h3 class="mt-5">Team</h3>
    <ul>
        <li th:each="m : ${team}" th:text="${m.fullName} + ' &mdash; ' + ${m.jobTitle}"></li>
    </ul>

    <h3 class="mt-5">Team Request History</h3>
    <table class="table table-bordered bg-white">
        <thead class="table-light">
        <tr>
            <th>Employee</th>
            <th>Leave Type</th>
            <th>Start</th>
            <th>End</th>
            <th>Days</th>
            <th>Status</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${teamHistory}">
            <td th:text="${r.employee.fullName}"></td>
            <td th:text="${r.leaveType.name}"></td>
            <td th:text="${r.startDate}"></td>
            <td th:text="${r.endDate}"></td>
            <td th:text="${r.numberOfDays}"></td>
            <td th:text="${r.status}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>

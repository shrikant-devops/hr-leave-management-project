<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">HR Leave Management</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/dashboard}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/leave/apply}">Apply Leave</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/leave/balance}">My Balance</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/leave/history}">My History</a></li>
                <li class="nav-item" sec:authorize="hasAnyRole('MANAGER','HR')">
                    <a class="nav-link" th:href="@{/manager/requests}">Team Requests</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('HR')">
                    <a class="nav-link" th:href="@{/hr/reports}">HR Reports</a>
                </li>
            </ul>
            <span class="navbar-text text-light me-3" sec:authentication="name"></span>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
            </form>
        </div>
    </div>
</nav>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Apply for Leave</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container">
    <h2>Apply for Leave</h2>
    <p th:if="${error}" class="alert alert-danger" th:text="${error}"></p>
    <form th:action="@{/leave/apply}" method="post" class="col-md-6">
        <div class="mb-3">
            <label class="form-label">Leave Type</label>
            <select name="leaveTypeId" class="form-select" required>
                <option th:each="type : ${leaveTypes}" th:value="${type.id}" th:text="${type.name}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Start Date</label>
            <input type="date" name="startDate" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">End Date</label>
            <input type="date" name="endDate" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Reason</label>
            <textarea name="reason" class="form-control" rows="3"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Submit Request</button>
        <a th:href="@{/dashboard}" class="btn btn-link">Cancel</a>
    </form>
</div>
</body>
</html>

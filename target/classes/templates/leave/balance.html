<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Leave Balance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container">
    <h2>My Leave Balance</h2>
    <table class="table table-bordered bg-white">
        <thead class="table-light">
        <tr>
            <th>Leave Type</th>
            <th>Total Days</th>
            <th>Used Days</th>
            <th>Remaining</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="b : ${balances}">
            <td th:text="${b.leaveType.name}"></td>
            <td th:text="${b.totalDays}"></td>
            <td th:text="${b.usedDays}"></td>
            <td th:text="${b.remainingDays}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(balances)}">
            <td colspan="4" class="text-muted">No balance records yet.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>

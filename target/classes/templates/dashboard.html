<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - HR Leave Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container">
    <h2>Welcome, <span th:text="${user.fullName}"></span></h2>
    <p class="text-muted" th:text="${user.jobTitle} + ' &middot; ' + ${user.department}"></p>

    <div class="row mt-4 g-3">
        <div class="col-md-4">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">Apply for Leave</h5>
                    <p class="card-text">Submit a new leave request.</p>
                    <a th:href="@{/leave/apply}" class="btn btn-primary">Apply</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">Leave Balance</h5>
                    <p class="card-text">Check your remaining leave days.</p>
                    <a th:href="@{/leave/balance}" class="btn btn-outline-primary">View Balance</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">Leave History</h5>
                    <p class="card-text">Review your past requests.</p>
                    <a th:href="@{/leave/history}" class="btn btn-outline-primary">View History</a>
                </div>
            </div>
        </div>
        <div class="col-md-4" sec:authorize="hasAnyRole('MANAGER','HR')">
            <div class="card h-100 border-warning">
                <div class="card-body">
                    <h5 class="card-title">Team Requests</h5>
                    <p class="card-text">Approve or reject requests from your team.</p>
                    <a th:href="@{/manager/requests}" class="btn btn-warning">Review</a>
                </div>
            </div>
        </div>
        <div class="col-md-4" sec:authorize="hasRole('HR')">
            <div class="card h-100 border-success">
                <div class="card-body">
                    <h5 class="card-title">HR Reports</h5>
                    <p class="card-text">Company-wide leave reports.</p>
                    <a th:href="@{/hr/reports}" class="btn btn-success">Open Reports</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>

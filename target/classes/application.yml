server:
  port: 8080

spring:
  application:
    name: hr-leave-management
  datasource:
    url: jdbc:h2:file:./data/hrleavedb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  thymeleaf:
    cache: false

logging:
  level:
    org.springframework.security: INFO

app:
  seed-demo-data: true

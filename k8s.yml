apiVersion: apps/v1
kind: Deployment
metadata:
  name: hrapp-deployment
spec:
  replicas: 1

  selector:
    matchLabels:
      app: hrapp

  template:
    metadata:
      labels:
        app: hrapp

    spec:
      containers:
        - name: hrapp
          image: hrapp:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          env:
            - name: DB_PASSWORD
              value: "7000150409"

---
apiVersion: v1
kind: Service
metadata:
  name: hrapp-service

spec:
  type: NodePort

  selector:
    app: hrapp

  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30081
